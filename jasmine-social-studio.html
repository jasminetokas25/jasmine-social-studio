  const L=(t,a)=>h`<div className="mb-7"><h4 className="eyebrow mb-3">${t}</h4><ul className="space-y-2">${a.map(x=>h`<li key=${x} className="flex gap-3"><span className="wine">•</span><span>${x}</span></li>`)}</ul></div>`;
  return h`<div className="modal-bg" onClick=${onClose}><div role="dialog" aria-modal="true" aria-label=${p.title} className="card max-w-3xl w-full my-4" style=${{transform:"none"}} onClick=${e=>e.stopPropagation()}>
    <div className="p-7 md:p-10"><div className="flex justify-between items-start gap-4 mb-6"><div><span className="chip mb-3">${p.tag}</span><h3 className="serif text-4xl">${p.title}</h3><p className="muted text-sm mt-2">Conceptual work. Not a real client project. Content below is sample material, with no performance results.</p></div>
      <button ref=${btn} onClick=${onClose} className="btn btn-o !px-4 !py-2" aria-label="Close case study">✕</button></div>
    <div className="mb-7"><h4 className="eyebrow mb-3">Brand objective</h4><p>${p.objective}</p></div>
    <div className="mb-7"><h4 className="eyebrow mb-3">Target audience</h4><p>${p.audience}</p></div>
    ${L("Content strategy overview",p.strategy)}
    <div className="mb-8"><h4 className="eyebrow mb-3">Sample Instagram posts and captions</h4><div className="grid sm:grid-cols-3 gap-4">${p.posts.map((t,i)=>h`<${MockPost} key=${i} p=${p} t=${t} c=${p.captions[i]} i=${i}/>`)}</div></div>
    <div className="mb-8"><h4 className="eyebrow mb-3">Carousel examples (cover slides)</h4><div className="flex gap-4 overflow-x-auto pb-2">${p.carousels.map((t,i)=>h`<div key=${i} className=${"sl"+(i%3===2?" sl-d":"")} style=${i%3===2?{}:{background:i%3===0?p.tint:"#FAF6F0"}}><small>0${i+1} / 0${p.carousels.length}</small><span className="serif">${t}</span><small>Swipe →</small></div>`)}</div></div>
    <div className="mb-8"><h4 className="eyebrow mb-3">Reel cover concepts</h4><div className="grid grid-cols-3 gap-3 sm:gap-4">${p.reels.map((t,i)=>h`<div key=${i} className=${"rl"+(i%3===1?" rl-d":"")} style=${i%3===1?{}:{background:i%3===0?p.tint:"#FAF6F0"}}><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z"/></svg><span>${t}</span></div>`)}</div></div>
    <div><h4 className="eyebrow mb-3">Sample content calendar (1 month)</h4><div className="grid sm:grid-cols-2 gap-3">${p.calendar.map(([w,t])=>h`<div key=${w} className="rounded-xl p-4" style=${{background:"var(--bg2)"}}><b className="wine">${w}</b><p className="text-sm mt-1">${t}</p></div>`)}</div></div>
    <div className="mt-8"><a href="#contact" onClick=${onClose} className="btn btn-p">Want something like this?</a></div></div></div></div>`;
}

function Experience(){
  return h`<section id="experience" className="max-w-6xl mx-auto px-5 py-24"><${Head} eyebrow="Experience" title="Where I’ve learned so far"/>
    <${Rv}><div className="card p-8 md:p-10"><div className="flex flex-wrap justify-between gap-2 mb-6"><div><h3 className="serif text-3xl">${EXPERIENCE.role}</h3><p className="wine font-medium">${EXPERIENCE.org}</p></div><span className="chip self-start">${EXPERIENCE.dur}</span></div>
    <ol className="border-l-2 ml-2 space-y-6" style=${{borderColor:"var(--line)"}}>${EXPERIENCE.points.map(([t,d])=>h`<li key=${t} className="relative pl-7"><span className="absolute -left-[7px] top-2 w-3 h-3 rounded-full" style=${{background:"var(--wine)"}}></span><h4 className="font-semibold">${t}</h4><p className="muted text-sm">${d}</p></li>`)}</ol></div><//></section>`;
}

function Pricing(){
  return h`<section id="pricing" className="py-24" style=${{background:"var(--bg2)"}}><div className="max-w-6xl mx-auto px-5"><${Head} eyebrow="Pricing" title="Simple monthly packages"/>
    <div className="grid md:grid-cols-3 gap-6">${PACKAGES.map(p=>h`<${Rv} key=${p.name}><div className="card p-8 h-full flex flex-col" style=${p.hot?{borderColor:"var(--wine)",borderWidth:2}:{}}>
      ${p.hot&&h`<span className="chip self-start mb-3">Most popular</span>`}<h3 className="serif text-3xl">${p.name}</h3><p className="mt-2"><span className="serif text-5xl wine">${p.price}</span><span className="muted"> / month</span></p>
      <ul className="mt-6 space-y-2 flex-1">${p.items.map(i=>h`<li key=${i} className="flex gap-3"><span className="wine">✓</span><span>${i}</span></li>`)}</ul>
      <a href="#contact" className=${"btn mt-8 "+(p.hot?"btn-p":"btn-o")}>Choose ${p.name}</a></div><//>`)}</div>
    <p className="muted text-sm mt-8 text-center">These packages are introductory offers, and final deliverables can be customised to your brand’s needs. Follower growth, engagement and sales cannot be guaranteed.</p></div></section>`;
}

function Contact(){
  const [f,setF]=useState({name:"",email:"",svc:"Social Media Management",msg:""});
  const [note,setNote]=useState("");
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const send=e=>{e.preventDefault();
    if(!CONFIG.email){setNote("The contact email hasn’t been set up yet. Please try Instagram or LinkedIn below once available.");return}
    const body=`Hi Jasmine,\n\n${f.msg}\n\nService: ${f.svc}\nFrom: ${f.name} (${f.email})`;
    window.location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent("Project enquiry from "+f.name)}&body=${encodeURIComponent(body)}`;
    setNote("Your email app should open with the message ready to send. If nothing opens, email me directly at "+CONFIG.email+".")};
  const links=[["Email",CONFIG.email&&"mailto:"+CONFIG.email,CONFIG.email],["Instagram",CONFIG.instagram,"@jasminetokas27"],["LinkedIn",CONFIG.linkedin,"Jasmine Tokas"],["WhatsApp",CONFIG.whatsapp&&"https://wa.me/"+CONFIG.whatsapp.replace(/\D/g,""),"Message me"]].filter(l=>l[1]);
  return h`<section id="contact" className="max-w-6xl mx-auto px-5 py-24 grid md:grid-cols-2 gap-14">
    <${Rv}><p className="eyebrow mb-3">Contact</p><h2 className="serif text-4xl md:text-5xl">Let’s create something meaningful together.</h2><p className="muted mt-5 max-w-md">Tell me about your brand, your goals and what you’d like help with. I’ll reply with ideas and next steps.</p>
      <ul className="mt-8 space-y-3">${links.map(([l,u,t])=>h`<li key=${l} className="flex gap-3"><b className="w-24">${l}</b>${u?h`<a className="wine underline" href=${u} target=${l==="Email"?undefined:"_blank"} rel="noopener noreferrer">${t}</a>`:h`<span className="muted">Coming soon</span>`}</li>`)}</ul><//>
    <${Rv}><form onSubmit=${send} className="card p-7 space-y-4" style=${{transform:"none"}}>
      <label className="block text-sm">Your name<input required className="field mt-1" value=${f.name} onChange=${set("name")}/></label>
      <label className="block text-sm">Email<input required type="email" className="field mt-1" value=${f.email} onChange=${set("email")}/></label>
      <label className="block text-sm">I’m interested in<select className="field mt-1" value=${f.svc} onChange=${set("svc")}>${[...SERVICES.map(s=>s[1]),"Not sure yet"].map(s=>h`<option key=${s}>${s}</option>`)}</select></label>
      <label className="block text-sm">Message<textarea required rows="4" className="field mt-1" value=${f.msg} onChange=${set("msg")}></textarea></label>
      <button className="btn btn-p w-full" type="submit">Send message</button><p role="status" className="text-sm wine">${note}</p></form><//></section>`;
}

function App(){
  const [open,setOpen]=useState(null);
  return h`<div><${Nav}/><main><${Hero}/><${About}/><${Services}/><${Work} onOpen=${setOpen}/><${Experience}/><${Pricing}/><${Contact}/></main>
    <footer className="border-t py-10 text-center text-sm muted px-5" style=${{borderColor:"var(--line)"}}><p className="serif text-2xl wine mb-1">${CONFIG.brand}</p><p>${CONFIG.tagline}</p><p className="mt-3">© 2026 ${CONFIG.name}. Portfolio projects are concept or sample work.</p></footer>
    ${open&&h`<${Case} p=${open} onClose=${()=>setOpen(null)}/>`}</div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
</body>
</html>
